# Compila el APK de Android de Lichii (src/android) en los servidores de GitHub.
# Uso: copia este archivo a .github/workflows/android.yml en tu fork de
# zortos293/Lichii (rama nx2), ve a la pestaña Actions -> "Android APK" -> Run workflow.
# Al terminar, descarga el artefacto "lichii-android" (contiene el .apk).
name: Android APK

on:
  workflow_dispatch:
    inputs:
      task:
        description: "Variante (Mainline = Android 13+, Legacy = Android 10+)"
        default: "assembleMainlineRelWithDebInfo"
        type: choice
        options:
          - assembleMainlineRelWithDebInfo
          - assembleLegacyRelWithDebInfo

jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - name: Liberar espacio en disco
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/local/share/boost /opt/hostedtoolcache/CodeQL
          df -h /

      - uses: actions/checkout@v5
        with:
          submodules: recursive
          fetch-depth: 0   # build.gradle.kts usa `git describe` para la versión

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # El runner ya trae el Android SDK en $ANDROID_HOME; solo añadimos
      # las versiones exactas que pide src/android/app/build.gradle.kts
      - name: Instalar SDK 36, NDK 28.2 y CMake 3.31.5
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" --install "platforms;android-36" "ndk;28.2.13676358" "cmake;3.31.5"

      - name: Instalar herramientas del host
        run: sudo apt-get update && sudo apt-get install -y glslang-tools

      # Primero el código nativo: su configuración de CMake copia las fuentes
      # Java de SDL a externals/generated/sdl, que el Kotlin necesita después.
      - name: Compilar código nativo (C++)
        working-directory: src/android
        env:
          CMAKE_BUILD_PARALLEL_LEVEL: 4
        run: |
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          export ANDROID_NDK_ROOT="$ANDROID_HOME/ndk/28.2.13676358"
          chmod +x gradlew
          TASK="${{ inputs.task }}"
          ./gradlew "${TASK/assemble/externalNativeBuild}" --no-daemon --stacktrace

      # Si falla el C++, sigue compilando todo lo demás (ninja -k 0) para
      # listar TODOS los errores de una vez en lugar de uno por intento.
      - name: Listar todos los errores de C++
        if: failure()
        run: |
          BUILD_DIR=$(ls -d src/android/app/.cxx/RelWithDebInfo/*/arm64-v8a | head -1)
          "$ANDROID_HOME/cmake/3.31.5/bin/ninja" -C "$BUILD_DIR" -k 0 > ninja.log 2>&1 || true
          echo "=== Errores de C++ (sin repetir) ==="
          grep -E "error:" ninja.log | sed "s|$GITHUB_WORKSPACE/||g" | sort -u | head -300 || true

      - name: Comprobar fuentes Java de SDL
        run: ls -R externals/generated/sdl 2>&1 | head -40 || true

      - name: Compilar APK
        working-directory: src/android
        env:
          CMAKE_BUILD_PARALLEL_LEVEL: 4
        run: |
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          export ANDROID_NDK_ROOT="$ANDROID_HOME/ndk/28.2.13676358"
          ./gradlew ${{ inputs.task }} --no-daemon --stacktrace

      - name: Subir APK
        uses: actions/upload-artifact@v4
        with:
          name: lichii-android
          path: src/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
